[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glassgraph"
version = "0.1.0"
description = "Deterministic Markdown evidence tooling"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6", "tomli>=2; python_version < '3.11'"]

[project.scripts]
glassgraph = "glassgraph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
